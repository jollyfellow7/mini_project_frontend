# ⚠️ 이 워크플로우는 비활성화되었습니다 (공개 리포 보안).
#
# 기존 버전은 keystore의 base64 값과 비밀번호를 Actions 로그에 그대로
# 출력했습니다. 이 리포지토리는 PUBLIC 이므로, 그 로그를 누구나 열람할 수
# 있어 서명 키가 통째로 유출됩니다(앱 위조 가능). 그래서 제거했습니다.
#
# 대신 keystore는 본인 PC에서 1회만 로컬로 생성하고, base64 값을 GitHub
# Secrets 에만 등록하세요. 키는 로그/리포 어디에도 남지 않습니다.
#
# ── 로컬 생성 방법 (Windows PowerShell, JDK/Android Studio 설치돼 있으면 keytool 사용 가능) ──
#
#   keytool -genkeypair -v -keystore chungsora-release.jks -alias chungsora `
#     -keyalg RSA -keysize 2048 -validity 36500 `
#     -storepass "chungsora2026!" -keypass "chungsora2026!" `
#     -dname "CN=Chungsora, OU=Dev, O=Chungsora, L=Seoul, S=Seoul, C=KR"
#
#   # base64 (한 줄)
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("chungsora-release.jks")) | Set-Clipboard
#   # → 클립보드에 복사된 값을 Secret KEYSTORE_BASE64 에 붙여넣기
#
# ── 등록할 GitHub Secrets (Settings → Secrets and variables → Actions) ──
#   KEYSTORE_BASE64   = (위 base64 값 전체)
#   KEYSTORE_ALIAS    = chungsora
#   KEYSTORE_PASSWORD = chungsora2026!
#   KEY_PASSWORD      = chungsora2026!
#
# ⚠️ chungsora-release.jks 파일은 절대 잃어버리지 말고 안전한 곳에 백업하세요.
#    이 키를 잃으면 같은 앱을 더 이상 업데이트할 수 없습니다(재설치 시 또 서명 불일치).

name: (사용 안 함) Keystore 생성 안내

on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: 안내
        run: |
          echo "이 워크플로우는 보안상 비활성화되었습니다."
          echo "keystore는 로컬에서 생성하고 GitHub Secrets에만 등록하세요."
          echo "자세한 방법은 이 파일(.github/workflows/generate-keystore.yml) 상단 주석을 참고하세요."
