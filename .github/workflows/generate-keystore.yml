# Keystore 최초 1회 생성 워크플로우
# Actions 탭 → "Keystore 생성 (최초 1회만)" → Run workflow
# 로그에서 base64 값 복사 → GitHub Secrets에 등록 후 이 워크플로우는 더 이상 실행 불필요

name: Keystore 생성 (최초 1회만)

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: release keystore 생성
        run: |
          keytool -genkeypair -v \
            -keystore chungsora-release.jks \
            -alias chungsora \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass chungsora2026! \
            -keypass chungsora2026! \
            -dname "CN=Chungsora, OU=Dev, O=Chungsora, L=Seoul, S=Seoul, C=KR"

      - name: Base64 출력 — 아래 값을 Secrets에 등록하세요
        run: |
          echo "====== KEYSTORE_BASE64 (아래 전체 복사) ======"
          base64 -w 0 chungsora-release.jks
          echo ""
          echo "================================================"
          echo "KEYSTORE_ALIAS   : chungsora"
          echo "KEYSTORE_PASSWORD: chungsora2026!"
          echo "KEY_PASSWORD     : chungsora2026!"
          echo "================================================"
          echo ""
          echo "GitHub → Settings → Secrets and variables → Actions → New repository secret"
          echo "  KEYSTORE_BASE64   = (위 base64 값 전체)"
          echo "  KEYSTORE_ALIAS    = chungsora"
          echo "  KEYSTORE_PASSWORD = chungsora2026!"
          echo "  KEY_PASSWORD      = chungsora2026!"
